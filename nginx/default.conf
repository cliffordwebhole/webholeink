server {
    listen 80;
    server_name _;

    root /var/www/webholeink/public;
    index index.php index.html;

    # ----------------------------------
    # Security + SEO Headers (GLOBAL)
    # ----------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    add_header X-Robots-Tag "index, follow" always;
    add_header X-Robots-Tag "max-image-preview:large" always;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # ----------------------------------
    # Static Assets (NEVER hit PHP)
    # ----------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # ----------------------------------
    # Main Routing
    # ----------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ----------------------------------
    # PHP
    # ----------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass webholeink_org_app:9000;
    }

    # ----------------------------------
    # Block Hidden Files
    # ----------------------------------
    location ~ /\. {
        deny all;
    }
}
